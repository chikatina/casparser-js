name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-packagebuilder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Upgrade npm to latest for Trusted Publishing OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Verify schemas
        run: |
          npm run schema
          git diff --exit-code schema/

      - name: Stage package on npm via Trusted Publishing with provenance
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@chikatina/casparser-js@$CURRENT_VERSION" version > /dev/null 2>&1; then
            echo "Version $CURRENT_VERSION is already published on npm; skipping."
            exit 0
          fi
          npm stage publish --provenance --access public
